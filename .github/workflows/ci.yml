name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.3

jobs:
  quality:
    name: Qualité
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Installer Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Auditer les dépendances
        run: bun audit --audit-level=high

      - name: Vérifier la cohérence des versions
        run: node scripts/check-versions.mjs

      - name: Lint
        run: bun run lint

      - name: Vérification TypeScript
        run: bun run typecheck

      - name: Tests unitaires
        run: bun run test

      - name: Build PWA
        run: bun run build

      - name: Build extension navigateur
        run: bun run extension:build

      - name: Conserver le build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coffre-dist
          path: |
            dist
            dist-extension
          retention-days: 7

  e2e:
    name: Parcours Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Installer Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Installer Chromium et WebKit
        run: bunx playwright install --with-deps chromium webkit

      - name: Exécuter les parcours
        run: bun run test:e2e

      - name: Conserver les traces en cas d’échec
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-results
          path: |
            playwright-report
            test-results
          retention-days: 7

  rust:
    name: Rust (fmt, clippy, tests, audit)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Installer les dépendances Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Mettre en cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target

      - name: Vérifier le formatage
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Tests Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --lib

      - name: Tests du CLI
        run: cargo test --manifest-path src-tauri/Cargo.toml -p coffre-cli

      - name: Smoke du relais natif
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --bin coffre
          node scripts/smoke-bridge.mjs

      - name: Installer cargo-audit
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: cargo-audit

      - name: Auditer les crates
        working-directory: src-tauri
        run: cargo audit

  core:
    name: coffre-core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Mettre en cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target

      - name: Vérifier le formatage
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy du cœur
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -p coffre-core -p coffre-core-ffi -p coffre-cli -p coffre-ssh-agent --all-targets -- -D warnings

      - name: Tests et vecteurs croisés
        run: cargo test --manifest-path src-tauri/Cargo.toml -p coffre-core -p coffre-core-ffi -p coffre-cli -p coffre-ssh-agent

  smoke-extension:
    name: Extension Chromium (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Installer Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Installer Chromium et xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          bunx playwright install --with-deps chromium

      - name: Construire l’extension
        run: bun run extension:build

      - name: Démarrer l’application et le formulaire de test
        run: |
          bun run dev -- --host 127.0.0.1 --port 1420 --strictPort > /tmp/vite.log 2>&1 &
          node scripts/smoke-target.mjs > /tmp/target.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:1420/ > /dev/null && \
            curl -sf http://127.0.0.1:8099/ > /dev/null && break
            sleep 1
          done

      - name: Tester recherche, remplissage et verrouillage
        env:
          COFFRE_APP_URL: http://127.0.0.1:1420
          COFFRE_TARGET_URL: http://127.0.0.1:8099
        run: xvfb-run -a node scripts/smoke-extension.mjs

  desktop:
    name: Desktop (${{ matrix.os }})
    # macOS et Windows sont coûteux : build uniquement sur main ou à la demande.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Installer les dépendances Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev

      - name: Installer Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Mettre en cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Compiler le bundle desktop
        run: bun run desktop:build

      - name: Conserver les artefacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coffre-desktop-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**
          if-no-files-found: warn
          retention-days: 7
