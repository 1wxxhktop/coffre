name: CI

# Dépôt public : les runners GitHub standard sont gratuits. Les PR normales
# passent par le workflow « Bêta PR » (tests minimaux + bêta macOS). La suite
# complète (Playwright, Rust, desktop, SBOM) tourne sur main, sur les PR
# étiquetées full-ci/stable, et à la demande.
# Un push sur main qui ne touche que la documentation ne relance pas la CI ;
# les PR sont toujours vérifiées, car la protection de main l’exige.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
  # Pas de filtre sur les PR : les vérifications obligatoires (Qualité et
  # Bêta macOS) tournent sur chaque PR. Les labels full-ci/stable déclenchent
  # la suite complète, y compris lorsqu’ils sont ajoutés après l’ouverture.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.3

jobs:
  quality:
    name: Qualité
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Installer Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Auditer les dépendances
        # Les deux avis modérés restants sont des dépendances de build
        # (glob/minimatch via workbox et cyclonedx) sans correctif compatible ;
        # ils sont suivis et ignorés explicitement pour garder le gate utile.
        run: >-
          bun audit --audit-level=moderate
          --ignore=GHSA-3g3m-2fjr-6pw4
          --ignore=GHSA-g3hv-75wg-m249

      - name: Vérifier la cohérence des versions
        run: node scripts/check-versions.mjs

      - name: Lint
        run: bun run lint

      - name: Vérification TypeScript
        run: bun run typecheck

      - name: Tests unitaires et couverture
        run: bun run test:coverage

      - name: Build PWA
        run: bun run build

      - name: Build extension navigateur
        run: bun run extension:build

      - name: Conserver le build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coffre-dist
          path: |
            dist
            dist-extension
          retention-days: 30

  e2e-shards:
    name: Playwright ${{ matrix.browser }} (shard ${{ matrix.shard }}/4)
    # WebKit Playwright est validé sur 22.04 ; 24.04 a fait échouer tous les
    # shards WebKit au premier essai. Ne pas changer sans revalider.
    runs-on: ubuntu-22.04
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || contains(github.event.pull_request.labels.*.name, 'stable')
    # Quatre shards par navigateur : le serveur et le stockage sont isolés par
    # job, ce qui divise le temps de WebKit (~18 min) sans changer les noms des
    # checks requis (voir le job e2e-gate ci-dessous).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        shard: [1, 2, 3, 4]
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Installer Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Mettre en cache le navigateur Playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # La clé inclut l’image : un cache WebKit créé sur une autre version
          # d’Ubuntu provoque des erreurs de bibliothèques (libicudata.so.78).
          key: playwright-v2-ubuntu-22.04-${{ matrix.browser }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright-v2-ubuntu-22.04-${{ matrix.browser }}-

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Installer le navigateur
        run: bunx playwright install --with-deps ${{ matrix.browser }}

      - name: Exécuter les parcours
        run: bunx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/4

      - name: Conserver les traces en cas d’échec
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-results-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  # Conserve les noms de checks exigés par la protection de branche
  # (« Parcours Playwright (chromium) » et « (webkit) »). Le gate échoue si un
  # seul shard a échoué, mais il ne relance aucun test.
  e2e-gate:
    name: Parcours Playwright (${{ matrix.browser }})
    needs: e2e-shards
    if: always() && needs.e2e-shards.result != 'skipped'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - name: Vérifier les shards
        run: |
          if [[ "${{ needs.e2e-shards.result }}" != "success" ]]; then
            echo "Au moins un shard Playwright a échoué ou a été annulé." >&2
            exit 1
          fi

  rust:
    name: Rust (fmt, clippy, tests, audit)
    runs-on: ubuntu-22.04
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || contains(github.event.pull_request.labels.*.name, 'stable')
    timeout-minutes: 25
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Installer les dépendances Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Mettre en cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target

      - name: Vérifier le formatage
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Tests Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --lib

      # Couvre aussi la partie Linux de `coffre-core` : tests d’intégration et
      # vecteurs croisés du cœur, du FFI, du CLI et de l’agent SSH.
      - name: Tests du cœur, du CLI et de l’agent SSH
        run: cargo test --manifest-path src-tauri/Cargo.toml -p coffre-core -p coffre-core-ffi -p coffre-cli -p coffre-ssh-agent

      - name: Smoke du relais natif
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --bin coffre
          node scripts/smoke-bridge.mjs

      - name: Installer cargo-audit
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit

      - name: Installer cargo-deny
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2

      - name: Vérifier licences, avis et sources
        run: cargo deny --manifest-path src-tauri/Cargo.toml --config src-tauri/deny.toml --workspace check

      - name: Auditer les crates
        working-directory: src-tauri
        run: cargo audit

  core:
    name: coffre-core (${{ matrix.os }})
    # Linux est couvert par le job Rust ; ici macOS et Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || contains(github.event.pull_request.labels.*.name, 'stable')
    timeout-minutes: 25
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Mettre en cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target

      - name: Vérifier le formatage
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy du cœur
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -p coffre-core -p coffre-core-ffi -p coffre-cli -p coffre-ssh-agent --all-targets -- -D warnings

      - name: Tests et vecteurs croisés
        run: cargo test --manifest-path src-tauri/Cargo.toml -p coffre-core -p coffre-core-ffi -p coffre-cli -p coffre-ssh-agent

  reproducible:
    name: Build reproductible
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || contains(github.event.pull_request.labels.*.name, 'stable')
    timeout-minutes: 20
    env:
      SOURCE_DATE_EPOCH: 0
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Installer Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Construire deux fois
        run: ./scripts/check-reproducible-build.sh

  desktop-reproducible:
    name: Desktop reproductible (macOS)
    # Long (deux bundles complets) : push vers main, label full-ci/stable ou
    # déclenchement manuel.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || contains(github.event.pull_request.labels.*.name, 'stable')
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      SOURCE_DATE_EPOCH: 0
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Installer Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Construire deux bundles macOS
        run: ./scripts/check-reproducible-desktop.sh

  sbom:
    name: SBOM
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || contains(github.event.pull_request.labels.*.name, 'stable')
    timeout-minutes: 25
    env:
      SOURCE_DATE_EPOCH: 0
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Installer Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1

      - name: Installer cargo-cyclonedx
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-cyclonedx@0.5.10

      - name: Générer les SBOM
        run: ./scripts/generate-sbom.sh

      - name: Conserver les SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coffre-sbom
          path: sbom
          retention-days: 7

  smoke-extension:
    name: Extension Chromium (smoke)
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || contains(github.event.pull_request.labels.*.name, 'stable')
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Installer Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Installer Chromium et xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          bunx playwright install --with-deps chromium

      - name: Construire l’extension
        run: bun run extension:build

      - name: Démarrer l’application et le formulaire de test
        run: |
          bun run dev -- --host 127.0.0.1 --port 1420 --strictPort > /tmp/vite.log 2>&1 &
          node scripts/smoke-target.mjs > /tmp/target.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:1420/ > /dev/null && \
            curl -sf http://127.0.0.1:8099/ > /dev/null && break
            sleep 1
          done

      - name: Tester recherche, remplissage et verrouillage
        env:
          COFFRE_APP_URL: http://127.0.0.1:1420
          COFFRE_TARGET_URL: http://127.0.0.1:8099
        run: xvfb-run -a node scripts/smoke-extension.mjs

  desktop:
    name: Desktop (${{ matrix.os }})
    # Builds complets sur les trois systèmes, sur main, label full-ci/stable
    # ou déclenchement manuel.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || contains(github.event.pull_request.labels.*.name, 'stable')
    timeout-minutes: 40
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Installer les dépendances Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev

      - name: Installer Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Mettre en cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Compiler le bundle desktop
        run: bun run desktop:build

      - name: Compiler les outils en ligne de commande
        shell: bash
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml \
            -p coffre-cli -p coffre-ssh-agent
          mkdir -p outils
          ext=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then ext=".exe"; fi
          for bin in coffre-cli coffre-git-sign; do
            cp "src-tauri/target/release/${bin}${ext}" outils/
          done
          # L’agent SSH repose sur un socket Unix : absent sous Windows.
          if [[ "$RUNNER_OS" != "Windows" ]]; then
            cp src-tauri/target/release/coffre-ssh-agent outils/
          fi

      # Récupérés par `bun run release:collect` dans le dossier local release/.
      - name: Conserver les artefacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coffre-desktop-${{ matrix.os }}
          # Paquets finaux seulement : le dossier de travail AppImage contient
          # Coffre.png et coffre.png, inextractibles sur un disque insensible à
          # la casse (macOS), et pèse plus de 200 Mo.
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*-setup.exe
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            outils/**
          if-no-files-found: warn
          retention-days: 30
