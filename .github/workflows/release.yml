name: Release macOS

on:
  push:
    tags:
      - 'v*'

# Aucun droit par défaut ; le job de release demande seulement l’écriture
# nécessaire à la création du brouillon de release.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.4.3
  COFFRE_TARGET: universal-apple-darwin

jobs:
  macos:
    name: Bundle macOS (ad hoc, ou Developer ID si configuré)
    runs-on: macos-latest
    # Un build bloqué ne doit pas immobiliser un runner pendant 90 minutes.
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Installer Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # Pas de cache Cargo ici : un cache partagé avec d’autres workflows
      # pourrait injecter des artefacts dans un build signé.

      - name: Vérifier que le tag correspond à la version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "v$version" != "${GITHUB_REF_NAME}" ]]; then
            echo "Le tag ${GITHUB_REF_NAME} ne correspond pas à la version v$version." >&2
            exit 1
          fi

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Installer cargo-audit
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: cargo-audit

      - name: Installer cargo-deny
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: cargo-deny@0.20.2

      - name: Vérifier avant de signer
        run: |
          bun audit --audit-level=moderate \
            --ignore=GHSA-3g3m-2fjr-6pw4 \
            --ignore=GHSA-g3hv-75wg-m249
          bun run lint
          bun run typecheck
          bun run test:coverage
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets --locked -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --workspace --all-targets --locked
          cargo deny --manifest-path src-tauri/Cargo.toml --config src-tauri/deny.toml --workspace check
          cargo audit --file src-tauri/Cargo.lock

      - name: Installer cargo-cyclonedx
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: cargo-cyclonedx@0.5.10

      - name: Générer les SBOM
        run: ./scripts/generate-sbom.sh

      - name: Importer le certificat Developer ID
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            # Pas de compte Apple : release signée ad hoc, sans notarisation.
            echo "Aucun certificat Developer ID : release ad hoc."
            exit 0
          fi
          keychain_password="$(uuidgen)"
          certificate="$RUNNER_TEMP/coffre-certificate.p12"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" build.keychain
          security default-keychain -s build.keychain
          security list-keychains -d user -s build.keychain
          security unlock-keychain -p "$keychain_password" build.keychain
          security import "$certificate" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" build.keychain
          security find-identity -v -p codesigning build.keychain
          rm -f "$certificate"

      - name: Construire, signer et notarier
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Mises à jour : clé privée minisign (secret) et clé publique
          # (variable du dépôt), intégrée au binaire à la compilation.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          COFFRE_UPDATER_PUBKEY: ${{ vars.COFFRE_UPDATER_PUBKEY }}
        run: ./scripts/release-macos.sh

      - name: Préparer le paquet et le manifeste de mise à jour
        run: |
          version="$(node -p "require('./package.json').version")"
          bundle="src-tauri/target/universal-apple-darwin/release/bundle/macos/Coffre.app.tar.gz"
          if [[ ! -f "$bundle" ]]; then
            echo "Aucun paquet de mise à jour (clé de signature absente) : release sans mise à jour automatique."
            exit 0
          fi
          asset="Coffre_${version}_universal.app.tar.gz"
          cp "$bundle" "$asset"
          cp "$bundle.sig" "$asset.sig"
          bun scripts/updater-manifest.ts build \
            --version "$version" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${asset}" \
            --signature-file "$asset.sig" \
            --notes "Notes de version : https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
            --out latest.json

      - name: Archiver le bundle .app
        run: |
          version="$(node -p "require('./package.json').version")"
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/Coffre.app"
          ditto -c -k --sequesterRsrc --keepParent "$app" \
            "Coffre_${version}_universal.app.zip"

      - name: Attester la provenance des artefacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            Coffre_*_universal.app.zip
            Coffre_*_universal.app.tar.gz

      - name: Créer la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          version="$(node -p "require('./package.json').version")"
          update_assets=()
          if [[ -f latest.json ]]; then
            update_assets=(
              "Coffre_${version}_universal.app.tar.gz"
              "Coffre_${version}_universal.app.tar.gz.sig"
              latest.json
            )
          fi
          prerelease=()
          if [[ "$version" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          notes=()
          if [[ -z "$APPLE_SIGNING_IDENTITY" ]]; then
            notes=(--notes "**Installation sur macOS** : cette version n’est pas notariée par Apple. À la première ouverture, macOS refuse de lancer Coffre : ouvrez Réglages Système → Confidentialité et sécurité, puis « Ouvrir quand même ». Vérifiez d’abord l’empreinte SHA-256 du DMG (fichier .sha256 ci-dessous). Les mises à jour suivantes, signées par la clé de Coffre, s’installent depuis l’application sans cet avertissement.")
          fi
          # Brouillon : la mise à jour n’est proposée qu’une fois la release
          # publiée par le workflow « Publier une mise à jour ».
          gh release create "$GITHUB_REF_NAME" \
            "src-tauri/target/universal-apple-darwin/release/bundle/dmg/"*.dmg \
            "src-tauri/target/universal-apple-darwin/release/bundle/dmg/"*.sha256 \
            "Coffre_${version}_universal.app.zip" \
            "${update_assets[@]}" \
            sbom/*.cdx.json \
            sbom/SHA256SUMS \
            --title "Coffre $version" \
            --generate-notes \
            "${notes[@]}" \
            --draft \
            "${prerelease[@]}" \
            --verify-tag

      - name: Supprimer le trousseau temporaire
        if: always()
        run: security delete-keychain build.keychain 2>/dev/null || true
