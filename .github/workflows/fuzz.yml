name: Fuzz

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: coffre-core (libFuzzer)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Installer Rust nightly
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: nightly

      - name: Installer cargo-fuzz
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-fuzz

      - name: Fuzzer le parseur
        working-directory: src-tauri/crates/coffre-core
        run: cargo fuzz run vault_parse -- -max_total_time=120 -rss_limit_mb=2048

      - name: Fuzzer la fusion
        working-directory: src-tauri/crates/coffre-core
        run: cargo fuzz run merge -- -max_total_time=120 -rss_limit_mb=2048

      - name: Conserver les artefacts en cas d’échec
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-artifacts
          path: src-tauri/crates/coffre-core/fuzz/artifacts
          retention-days: 7
