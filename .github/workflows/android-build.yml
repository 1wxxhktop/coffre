name: Android APK

# APK Android arm64. Avec la clé fixe (secrets ANDROID_KEYSTORE_*, créés par
# scripts/setup-android-key.sh), l’APK est un build release signé, non
# débogable : chaque version s’installe par-dessus la précédente. Sans clé
# (fork, Dependabot), l’APK reste un build de test debug, jamais publié.
on:
  workflow_call:
    inputs:
      version:
        description: Version à injecter (bêta) ; vide = version du dépôt
        required: false
        type: string
        default: ''
      ref:
        description: Commit ou référence à construire ; vide = celui de l’appelant
        required: false
        type: string
        default: ''
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
    outputs:
      signed:
        description: true si l’APK est signé avec la clé fixe
        value: ${{ jobs.build.outputs.signed }}
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.3
  ANDROID_SDK_VERSION: android-37.0
  ANDROID_BUILD_TOOLS: 36.0.0
  NDK_VERSION: r27c
  # APK de test : retirer les symboles Rust réduit l’archive de ~230 Mo à
  # ~50 Mo, sans changer le comportement de l’application.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_DEV_STRIP: debuginfo

jobs:
  build:
    name: APK Android arm64
    runs-on: ubuntu-24.04
    # Le build release optimisé est plus long que le build debug.
    timeout-minutes: 60
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Installer Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Installer Rust et la cible Android
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          targets: aarch64-linux-android

      - name: Mettre en cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target

      - name: Installer le SDK Android
        run: |
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -L --fail --silent --show-error \
            -o "$RUNNER_TEMP/cmdline-tools.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;${ANDROID_SDK_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "platform-tools"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Installer le NDK Android
        run: |
          curl -L --fail --silent --show-error \
            -o "$RUNNER_TEMP/android-ndk.zip" \
            "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q "$RUNNER_TEMP/android-ndk.zip" -d "$RUNNER_TEMP"
          echo "NDK_HOME=$RUNNER_TEMP/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Préparer la clé de signature
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" ]]; then
            KEYSTORE="$RUNNER_TEMP/coffre-android.p12"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            chmod 600 "$KEYSTORE"
            echo "COFFRE_ANDROID_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Clé fixe disponible : build release signé."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Clé Android absente : APK de test debug, non publiable."
          fi

      - name: Construire l’APK
        env:
          COFFRE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          COFFRE_BUILD_VERSION: ${{ inputs.version }}
          SIGNED: ${{ steps.key.outputs.signed }}
        run: |
          ARGS=(--apk --target aarch64 --ci)
          [[ "$SIGNED" == "true" ]] || ARGS=(--debug "${ARGS[@]}")
          if [[ -n "$COFFRE_BUILD_VERSION" ]]; then
            CONFIG="$(node -e 'console.log(JSON.stringify({ version: process.env.COFFRE_BUILD_VERSION }))')"
            ARGS+=(--config "$CONFIG")
          fi
          bunx tauri android build "${ARGS[@]}"

      - name: Vérifier et préparer l’APK
        env:
          SIGNED: ${{ steps.key.outputs.signed }}
          EXPECTED_CERT: ${{ vars.COFFRE_ANDROID_CERT_SHA256 }}
        run: |
          if [[ "$SIGNED" == "true" ]]; then
            apk="$(find src-tauri/gen/android/app/build/outputs/apk -path '*release*' -name '*.apk' ! -name '*unsigned*' | head -1)"
            name=coffre-android-arm64.apk
          else
            apk="$(find src-tauri/gen/android/app/build/outputs/apk -path '*debug*' -name '*.apk' | head -1)"
            name=coffre-android-arm64-debug.apk
          fi
          test -n "$apk" || { echo "APK introuvable." >&2; exit 1; }
          cp "$apk" "$name"
          if [[ "$SIGNED" == "true" ]]; then
            # Refuser un APK signé par une autre clé que celle déclarée : il ne
            # s’installerait pas par-dessus la version précédente.
            APKSIGNER="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner"
            CERT="$("$APKSIGNER" verify --print-certs "$name" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':' | tr 'A-F' 'a-f')"
            WANT="$(printf '%s' "$EXPECTED_CERT" | tr -d ': ' | tr 'A-F' 'a-f')"
            test -n "$CERT" || { echo "Signature de l’APK illisible." >&2; exit 1; }
            if [[ -n "$WANT" && "$CERT" != "$WANT" ]]; then
              echo "Certificat inattendu : $CERT (attendu $WANT)." >&2
              exit 1
            fi
            echo "Certificat de signature : $CERT"
          fi
          sha256sum "$name" > SHA256SUMS-android
          echo "APK_NAME=$name" >> "$GITHUB_ENV"
          ls -lh "$name" SHA256SUMS-android

      - name: Effacer la clé du runner
        if: always()
        run: rm -f "$RUNNER_TEMP/coffre-android.p12"

      - name: Conserver l’APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coffre-android-apk
          path: |
            ${{ env.APK_NAME }}
            SHA256SUMS-android
          if-no-files-found: error
