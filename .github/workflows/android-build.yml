name: Android APK

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.3
  ANDROID_SDK_VERSION: android-37.0
  ANDROID_BUILD_TOOLS: 36.0.0
  NDK_VERSION: r27c

jobs:
  build:
    name: APK de test arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Installer Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Installer Rust et la cible Android
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          targets: aarch64-linux-android

      - name: Mettre en cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target

      - name: Installer le SDK Android
        run: |
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -L --fail --silent --show-error \
            -o "$RUNNER_TEMP/cmdline-tools.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;${ANDROID_SDK_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "platform-tools"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Installer le NDK Android
        run: |
          curl -L --fail --silent --show-error \
            -o "$RUNNER_TEMP/android-ndk.zip" \
            "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q "$RUNNER_TEMP/android-ndk.zip" -d "$RUNNER_TEMP"
          echo "NDK_HOME=$RUNNER_TEMP/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Construire l’APK
        run: bunx tauri android build --debug --apk --target aarch64 --ci

      - name: Préparer l’artefact
        run: |
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)"
          test -n "$apk"
          cp "$apk" coffre-android-arm64-debug.apk
          sha256sum coffre-android-arm64-debug.apk > SHA256SUMS-android
          ls -lh coffre-android-arm64-debug.apk SHA256SUMS-android

      - name: Conserver l’APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coffre-android-apk
          path: |
            coffre-android-arm64-debug.apk
            SHA256SUMS-android
          if-no-files-found: error
