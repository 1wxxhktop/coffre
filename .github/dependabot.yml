version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      interface:
        patterns:
          - react
          - react-dom
          - lucide-react
      qualite:
        patterns:
          - vitest
          - '@vitest/coverage-v8'
          - '@playwright/test'
          - oxlint
          - typescript

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
