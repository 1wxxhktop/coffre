[package]
name = "coffre-ssh-agent"
version = "0.8.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-only"
description = "Noyau de l’agent SSH local de Coffre"

[dependencies]
ed25519-dalek = "2"
rsa = { version = "0.9", features = ["sha2"] }
serde_json = "1"
sha2 = "0.10"
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "ed25519", "rsa", "encryption", "rand_core"] }
zeroize = "1"

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
