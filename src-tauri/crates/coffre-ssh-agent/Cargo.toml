[package]
name = "coffre-ssh-agent"
version = "0.14.1"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-only"
description = "Noyau de l’agent SSH local de Coffre"

[dependencies]
clap = { version = "4", features = ["derive"] }
coffre-core = { path = "../coffre-core" }
ed25519-dalek = "3"
rsa = { version = "0.10", features = ["pkcs1v15"] }
serde_json = "1"
sha2 = "0.11"
rpassword = "7"
ssh-key = { version = "=0.7.0-rc.12", default-features = false, features = ["std", "ed25519", "rsa", "encryption", "rand_core"] }
zeroize = "1"

[dev-dependencies]
getrandom = "0.4"
