[package]
name = "coffre-cli"
version = "0.8.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-only"
description = "CLI locale de lecture pour les coffres Coffre"

[[bin]]
name = "coffre-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
coffre-core = { path = "../coffre-core" }
hmac = "0.12"
rpassword = "7"
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
