[package]
name = "coffre-cli"
version = "0.14.2"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-only"
description = "CLI locale de lecture pour les coffres Coffre"

[[bin]]
name = "coffre-cli"
path = "src/main.rs"

[[bin]]
name = "coffre-git-sign"
path = "src/bin/coffre-git-sign.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
coffre-core = { path = "../coffre-core" }
hmac = "0.13"
rpassword = "7"
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
ssh-key = { version = "=0.7.0-rc.12", features = ["ed25519", "rsa"] }
