[package]
name = "coffre-core"
version = "0.9.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-only"
description = "Cœur partagé du format et de la cryptographie Coffre"

[dependencies]
aes-gcm = "0.11"
argon2 = "0.5"
base64 = "0.22"
getrandom = "0.3"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
