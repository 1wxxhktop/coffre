[package]
name = "coffre-core"
version = "0.9.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-only"
description = "Cœur partagé du format et de la cryptographie Coffre"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.23"
getrandom = "0.3"
hmac = "0.12"
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
url = "2"
zeroize = { version = "1", features = ["derive"] }
