[package]
name = "coffre"
version = "0.8.0"
description = "Gestionnaire de mots de passe local-first, chiffré et hors ligne"
authors = ["Contributeurs de Coffre"]
license = "GPL-3.0-only"
edition = "2024"
rust-version = "1.90"

[lib]
name = "coffre_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
notify = "8.2.1"
tauri-plugin-dialog = "2.8.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
coffre-core = { path = "crates/coffre-core" }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "LAContext", "block2"] }
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service"] }

[workspace]
members = [".", "crates/coffre-core", "crates/coffre-core-ffi", "crates/coffre-cli", "crates/coffre-ssh-agent"]
resolver = "3"
