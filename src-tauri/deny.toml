# Politique cargo-deny de Coffre.
# Les avis temporairement ignorés sont documentés et suivis.

[advisories]
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "rsa 0.9 reste requis par ssh-key 0.6 ; agent SSH local, migration vers rsa 0.10/ssh-key 0.7 à suivre" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant transitoire via tauri-plugin-single-instance ; aucun correctif disponible" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names transitoire via tauri-plugin-single-instance ; aucun correctif disponible" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive transitoire via tauri-plugin-single-instance ; aucun correctif disponible" },
  { id = "RUSTSEC-2026-0374", reason = "basic-toml transitoire de la chaîne de build ; aucun correctif disponible" },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error transitoire de la chaîne de build ; aucun correctif disponible" },
]

[licenses]
confidence-threshold = 0.9
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "GPL-3.0-only",
  "GPL-3.0-or-later",
  "ISC",
  "LGPL-2.1-or-later",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
