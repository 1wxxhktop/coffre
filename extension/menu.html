<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coffre</title>
    <link rel="stylesheet" href="./menu.css" />
    <link rel="stylesheet" href="./logo.css" />
  </head>
  <body>
    <div id="badge" class="badge" hidden>
      <button id="badge-button" type="button" aria-label="Ouvrir Coffre" data-i18n-aria-label="menu_open">
        <span class="badge__mark" data-coffre-logo aria-hidden="true"></span>
      </button>
    </div>

    <div id="panel" class="panel" hidden>
      <header class="panel__head">
        <span class="panel__mark" data-coffre-logo aria-hidden="true"></span>
        <div>
          <strong>Coffre</strong>
          <small id="host"></small>
        </div>
        <button id="close" class="icon-button" type="button" aria-label="Fermer" data-i18n-aria-label="menu_close">
          ×
        </button>
      </header>

      <p id="message" class="message" hidden></p>

      <div id="phishing" class="phishing" hidden role="alert" aria-live="assertive">
        <strong data-i18n="phishing_title">Attention</strong>
        <p id="phishing-text"></p>
        <div class="phishing__actions">
          <button id="phishing-cancel" class="button button--secondary" type="button" data-i18n="phishing_cancel">Annuler</button>
          <button id="phishing-continue" class="button button--primary" type="button" data-i18n="phishing_continue">Continuer quand même</button>
        </div>
      </div>

      <section id="signup" class="signup" hidden aria-labelledby="signup-title">
        <div class="signup__head">
          <strong id="signup-title" data-i18n="menu_signupTitle">Utiliser un mot de passe fort</strong>
          <button id="signup-regenerate" class="icon-button" type="button" title="Régénérer" data-i18n-title="menu_signupRegenerate" aria-label="Régénérer" data-i18n-aria-label="menu_signupRegenerate">
            ↻
          </button>
        </div>
        <p class="signup__hint" data-i18n="menu_signupHint">Généré localement selon les règles du site.</p>
        <output id="signup-preview" class="signup__preview" aria-live="polite"></output>
        <button id="signup-use" class="button button--primary" type="button">
          <span data-i18n="menu_signupUse">Utiliser ce mot de passe</span>
        </button>
      </section>

      <div id="tabs" class="tabs" hidden>
        <button id="tab-login" class="tab tab--active" type="button" data-kind="login" data-i18n="menu_tabLogins">Connexions</button>
        <button id="tab-card" class="tab" type="button" data-kind="card" data-i18n="menu_tabCards">Cartes</button>
        <button id="tab-identity" class="tab" type="button" data-kind="identity" data-i18n="menu_tabIdentities">Identités</button>
        <button id="tab-custom" class="tab" type="button" data-kind="custom" data-i18n="menu_tabCustom">Modèles</button>
      </div>

      <div id="alias-wrap" class="search" hidden>
        <button id="alias-button" class="button button--secondary" type="button" data-i18n="menu_alias">Créer un alias e-mail</button>
      </div>

      <div id="search-wrap" class="search" hidden>
        <input
          id="search"
          type="search"
          autocomplete="off"
          spellcheck="false"
          placeholder="Rechercher…" data-i18n-placeholder="menu_search"
          aria-label="Rechercher un identifiant" data-i18n-aria-label="menu_searchLabel"
        />
      </div>

      <label id="sensitive-wrap" class="sensitive" hidden>
        <input id="include-sensitive" type="checkbox" />
        <span data-i18n="menu_includeSensitive">Inclure le CVC et le PIN (action explicite)</span>
      </label>

      <ul id="results" class="results"></ul>
      <p id="empty" class="empty" hidden></p>

      <div id="actions" class="actions" hidden>
        <button id="save" class="button button--primary" type="button">
          <span data-i18n="menu_save">Enregistrer dans Coffre</span>
        </button>
        <button id="ignore" class="button" type="button"><span data-i18n="menu_ignore">Ignorer</span></button>
      </div>

      <button id="exclude-site" class="link-button" type="button" hidden>
        <span data-i18n="menu_excludeSite">Ne plus afficher sur ce site</span>
      </button>
    </div>

    <script type="module" src="./menu.ts"></script>
  </body>
</html>
