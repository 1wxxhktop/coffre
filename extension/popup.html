<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coffre</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div class="popup">
      <header class="header">
        <img class="logo" src="./icons/icon-192.png" alt="" width="36" height="36" />
        <div class="header__text">
          <h1>Coffre</h1>
          <p id="site"><span data-i18n="popup_siteUnknown">Site inconnu</span></p>
        </div>
        <button id="settings" class="icon-button" type="button" title="Réglages" data-i18n-title="popup_settings">
          ⚙
        </button>
      </header>

      <main id="main" class="main">
        <p id="message" class="message" hidden></p>

        <div id="save-prompt" class="save-prompt" hidden>
          <p id="save-text" class="save-prompt__text"></p>
          <div class="save-prompt__actions">
            <button id="save-now" class="button button--primary" type="button">
              <span data-i18n="popup_save">Enregistrer</span>
            </button>
            <button id="save-ignore" class="button" type="button"><span data-i18n="popup_ignore">Ignorer</span></button>
          </div>
        </div>

        <div class="toolbar">
          <div id="search-wrap" class="search" hidden>
            <input
              id="search"
              type="search"
              autocomplete="off"
              spellcheck="false"
              placeholder="Rechercher un identifiant…" data-i18n-placeholder="popup_searchPlaceholder"
              aria-label="Rechercher un identifiant" data-i18n-aria-label="popup_searchLabel"
            />
          </div>
          <button
            id="generate"
            class="icon-button toolbar__generate"
            type="button"
            title="Générer un mot de passe"
            data-i18n-title="popup_generate"
            aria-label="Générer un mot de passe"
            data-i18n-aria-label="popup_generate"
          >
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="7.5" cy="15.5" r="3.5" />
              <path d="m10.5 13 8-8m-3 3 2 2m-5 1 2 2" />
            </svg>
          </button>
        </div>

        <section id="generator" class="generator" hidden aria-label="Générateur de mot de passe">
          <div class="generator__head">
            <strong data-i18n="popup_generatedTitle">Mot de passe généré</strong>
            <button id="generator-close" class="icon-button" type="button" aria-label="Fermer le générateur" data-i18n-aria-label="popup_generateClose">×</button>
          </div>
          <output id="generated-password" class="generator__value" aria-live="polite"></output>
          <div class="generator__actions">
            <button id="regenerate" class="button" type="button">
              <span data-i18n="popup_regenerate">Régénérer</span>
            </button>
            <button id="copy-generated" class="button button--primary" type="button">
              <span data-i18n="popup_copy">Copier</span>
            </button>
          </div>
        </section>

        <ul id="results" class="results"></ul>
        <p id="empty" class="empty" hidden></p>
        <button id="show-all" class="button button--secondary" type="button" hidden>
          <span data-i18n="popup_showAll">Afficher toutes mes connexions</span>
        </button>

        <div id="actions" class="actions" hidden>
          <button id="activate-inline" class="button" type="button" hidden>
            <span data-i18n="popup_activateInline">Activer le remplissage dans les champs</span>
          </button>
          <button id="pair" class="button button--primary" type="button" hidden>
            <span data-i18n="popup_pair">Associer l’extension</span>
          </button>
          <button id="open-app" class="button button--primary" type="button">
            <span data-i18n="popup_openApp">Ouvrir Coffre</span>
          </button>
          <button id="focus-app" class="button" type="button" hidden>
            <span data-i18n="popup_unlockApp">Déverrouiller Coffre</span>
          </button>
        </div>
      </main>

      <footer class="footer">
        <span id="footer-status"><span data-i18n="popup_footer">Local · aucun serveur</span></span>
      </footer>
    </div>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
