<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coffre</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div class="popup">
      <header class="header">
        <img class="logo" src="./icons/icon-192.png" alt="" width="36" height="36" />
        <div class="header__text">
          <h1>Coffre</h1>
          <p id="site"><span data-i18n="popup_siteUnknown">Site inconnu</span></p>
        </div>
        <button id="theme" class="icon-button" type="button" title="Changer de thème" data-i18n-title="theme_toggle" aria-label="Changer de thème" data-i18n-aria-label="theme_toggle">
          <span id="theme-icon" class="theme-icon" aria-hidden="true"></span>
        </button>
        <button id="settings" class="icon-button" type="button" title="Réglages" data-i18n-title="popup_settings">
          ⚙
        </button>
      </header>

      <main id="main" class="main">
        <div id="main-view">
        <p id="message" class="message" hidden></p>

        <div id="save-prompt" class="save-prompt" hidden>
          <p id="save-text" class="save-prompt__text"></p>
          <div class="save-prompt__actions">
            <button id="save-now" class="button button--primary" type="button">
              <span data-i18n="popup_save">Enregistrer</span>
            </button>
            <button id="save-ignore" class="button" type="button"><span data-i18n="popup_ignore">Ignorer</span></button>
          </div>
        </div>

        <div class="toolbar">
          <div id="search-wrap" class="search" hidden>
            <input
              id="search"
              type="search"
              autocomplete="off"
              spellcheck="false"
              placeholder="Rechercher un identifiant…" data-i18n-placeholder="popup_searchPlaceholder"
              aria-label="Rechercher un identifiant" data-i18n-aria-label="popup_searchLabel"
            />
          </div>
          <button
            id="generate"
            class="icon-button toolbar__generate"
            type="button"
            title="Générer un mot de passe"
            data-i18n-title="popup_generate"
            aria-label="Générer un mot de passe"
            data-i18n-aria-label="popup_generate"
          >
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="7.5" cy="15.5" r="3.5" />
              <path d="m10.5 13 8-8m-3 3 2 2m-5 1 2 2" />
            </svg>
          </button>
        </div>

        <section id="generator" class="generator" hidden aria-label="Générateur de mot de passe">
          <div class="generator__head">
            <strong data-i18n="popup_generatedTitle">Mot de passe généré</strong>
            <button id="generator-close" class="icon-button" type="button" aria-label="Fermer le générateur" data-i18n-aria-label="popup_generateClose">×</button>
          </div>
          <output id="generated-password" class="generator__value" aria-live="polite"></output>
          <p class="generator__entropy">
            <span data-i18n="popup_entropy">Entropie estimée</span>
            <strong id="generator-entropy">—</strong>
          </p>
          <div class="generator__options">
            <label class="generator__length" for="generator-length">
              <span class="generator__length-label">
                <span data-i18n="popup_length">Longueur</span>
                <strong id="generator-length-value">20</strong>
              </span>
              <input id="generator-length" type="range" min="8" max="64" step="1" value="20" />
            </label>
            <div class="generator__toggles" role="group" aria-label="Classes de caractères" data-i18n-aria-label="popup_characterClasses">
              <label class="generator__toggle">
                <input id="generator-lowercase" type="checkbox" checked />
                <span data-i18n="popup_lowercase">Minuscules</span>
              </label>
              <label class="generator__toggle">
                <input id="generator-uppercase" type="checkbox" checked />
                <span data-i18n="popup_uppercase">Majuscules</span>
              </label>
              <label class="generator__toggle">
                <input id="generator-digits" type="checkbox" checked />
                <span data-i18n="popup_digits">Chiffres</span>
              </label>
              <label class="generator__toggle">
                <input id="generator-symbols" type="checkbox" checked />
                <span data-i18n="popup_symbols">Symboles</span>
              </label>
            </div>
            <label class="generator__toggle generator__toggle--wide">
              <input id="generator-ambiguous" type="checkbox" checked />
              <span data-i18n="popup_excludeAmbiguous">Éviter les caractères ambigus (O, 0, I, l, 1…)</span>
            </label>
          </div>
          <div class="generator__actions">
            <button id="regenerate" class="button" type="button">
              <span data-i18n="popup_regenerate">Régénérer</span>
            </button>
            <button id="copy-generated" class="button button--primary" type="button">
              <span data-i18n="popup_copy">Copier</span>
            </button>
          </div>
        </section>

        <ul id="results" class="results"></ul>
        <p id="empty" class="empty" hidden></p>
        <button id="show-all" class="button button--secondary" type="button" hidden>
          <span data-i18n="popup_showAll">Afficher toutes mes connexions</span>
        </button>

        </div>

        <section id="settings-view" class="settings-view" hidden>
          <div class="settings-view__head">
            <button id="settings-back" class="button button--small" type="button">
              <span data-i18n="settings_back">Retour</span>
            </button>
            <h2 data-i18n="settings_title">Réglages</h2>
          </div>

          <section class="settings-group">
            <h3 data-i18n="settings_appearance">Apparence</h3>
            <div id="theme-choices" class="theme-choices" role="group" aria-label="Thème" data-i18n-aria-label="settings_appearance">
              <button type="button" class="theme-choice" data-theme-choice="dark" aria-pressed="false">
                <span data-i18n="theme_choice_dark">Sombre</span>
              </button>
              <button type="button" class="theme-choice" data-theme-choice="light" aria-pressed="false">
                <span data-i18n="theme_choice_light">Clair</span>
              </button>
              <button type="button" class="theme-choice" data-theme-choice="system" aria-pressed="false">
                <span data-i18n="theme_choice_system">Système</span>
              </button>
            </div>
          </section>

          <section class="settings-group">
            <h3 data-i18n="settings_appAddress">Adresse de l’application</h3>
            <label class="settings-field">
              <span data-i18n="options_url">URL de Coffre</span>
              <input id="settings-app-url" type="url" spellcheck="false" placeholder="http://localhost:1420" />
            </label>
            <div class="settings-actions">
              <button id="settings-save" class="button button--primary" type="button">
                <span data-i18n="settings_save">Enregistrer</span>
              </button>
              <button id="settings-test" class="button" type="button">
                <span data-i18n="settings_test">Tester</span>
              </button>
            </div>
            <p id="settings-status" class="settings-status" role="status"></p>
          </section>

          <section class="settings-group">
            <button id="settings-open-app" class="button" type="button">
              <span data-i18n="popup_openApp">Ouvrir Coffre</span>
            </button>
          </section>

          <p class="settings-note" data-i18n="settings_note">Local · aucun serveur · aucune télémétrie.</p>
        </section>
      </main>

      <div id="bottom-dock" class="bottom-dock">
        <div id="actions" class="actions" hidden>
          <button id="activate-inline" class="button" type="button" hidden>
            <span data-i18n="popup_activateInline">Activer le remplissage dans les champs</span>
          </button>
          <button id="pair" class="button button--primary" type="button" hidden>
            <span data-i18n="popup_pair">Associer l’extension</span>
          </button>
          <button id="open-app" class="button button--primary" type="button">
            <span data-i18n="popup_openApp">Ouvrir Coffre</span>
          </button>
          <button id="focus-app" class="button" type="button" hidden>
            <span data-i18n="popup_unlockApp">Déverrouiller Coffre</span>
          </button>
        </div>
        <p id="inline-status" class="inline-status" hidden>
          <span class="inline-status__dot" aria-hidden="true"></span>
          <span data-i18n="popup_inlineActive">Remplissage actif dans cet onglet</span>
        </p>
        <footer class="footer">
          <span id="footer-status"><span data-i18n="popup_footer">Local · aucun serveur</span></span>
        </footer>
      </div>
    </div>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
