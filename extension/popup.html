<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coffre</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div class="popup">
      <header class="header">
        <img class="logo" src="./icons/icon-192.png" alt="" width="36" height="36" />
        <div class="header__text">
          <h1>Coffre</h1>
          <p id="site">Site inconnu</p>
        </div>
        <button id="settings" class="icon-button" type="button" title="Réglages">
          ⚙
        </button>
      </header>

      <main id="main" class="main">
        <p id="message" class="message" hidden></p>

        <div id="search-wrap" class="search" hidden>
          <input
            id="search"
            type="search"
            autocomplete="off"
            spellcheck="false"
            placeholder="Rechercher un identifiant…"
            aria-label="Rechercher un identifiant"
          />
        </div>

        <ul id="results" class="results"></ul>
        <p id="empty" class="empty" hidden></p>
        <button id="show-all" class="button button--secondary" type="button" hidden>
          Afficher toutes mes connexions
        </button>

        <div id="actions" class="actions" hidden>
          <button id="open-app" class="button button--primary" type="button">
            Ouvrir Coffre
          </button>
          <button id="focus-app" class="button" type="button" hidden>
            Déverrouiller Coffre
          </button>
        </div>
      </main>

      <footer class="footer">
        <span id="footer-status">Local · aucun serveur</span>
      </footer>
    </div>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
