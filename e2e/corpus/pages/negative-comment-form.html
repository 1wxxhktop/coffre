<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Commentaires</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 28rem; }
    form { display: grid; gap: 0.75rem; }
    label { font-weight: 600; }
    input, button { padding: 0.6rem; font: inherit; }
    .muted { color: #555; font-size: 0.9rem; }
  </style>
</head>
<body>
<main>
  <h1>Laisser un commentaire</h1>
  <form action="/comments" method="post">
    <label for="subject">Sujet</label>
    <input id="subject" name="subject" data-corpus-ref="subject" />
    <label for="comment">Commentaire</label>
    <textarea id="comment" name="comment" rows="5" data-corpus-ref="comment"></textarea>
    <button>Publier</button>
  </form>
</main>
</body>
</html>
