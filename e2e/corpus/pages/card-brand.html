<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paiement</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 28rem; }
    form { display: grid; gap: 0.75rem; }
    label { font-weight: 600; }
    input, button { padding: 0.6rem; font: inherit; }
    .muted { color: #555; font-size: 0.9rem; }
  </style>
</head>
<body>
<main>
  <h1>Paiement</h1>
  <form action="/checkout" method="post">
    <label for="number">Numéro de carte</label>
    <input id="number" name="number" autocomplete="cc-number" data-corpus-ref="number" />
    <label for="expiry">Date d’expiration</label>
    <input id="expiry" name="expiry" autocomplete="cc-exp" data-corpus-ref="expiry" />
    <label for="cvc">Code de sécurité</label>
    <input id="cvc" name="cvc" autocomplete="cc-csc" data-corpus-ref="cvc" />
    <label for="brand">Réseau de la carte</label>
    <input id="brand" name="brand" autocomplete="cc-type" data-corpus-ref="brand" />
    <button>Payer</button>
  </form>
</main>
</body>
</html>
