<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connexion</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 28rem; }
    form { display: grid; gap: 0.75rem; }
    label { font-weight: 600; }
    input, button { padding: 0.6rem; font: inherit; }
    .muted { color: #555; font-size: 0.9rem; }
  </style>
</head>
<body>
<main>
  <h1>Connexion</h1>
  <form action="/session" method="post">
    <input type="search" name="q" placeholder="Rechercher" data-corpus-ref="search" />
    <label for="login">Identifiant</label>
    <input id="login" name="login" autocomplete="username" data-corpus-ref="login" />
    <label for="password">Mot de passe</label>
    <input id="password" name="password" type="password" autocomplete="current-password" data-corpus-ref="password" />
    <button>Se connecter</button>
  </form>
</main>
</body>
</html>
