<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Espace client</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 28rem; }
    form { display: grid; gap: 0.75rem; }
    label { font-weight: 600; }
    input, button { padding: 0.6rem; font: inherit; }
    .muted { color: #555; font-size: 0.9rem; }
  </style>
</head>
<body>
<main>
  <h1>Espace client</h1>
  <form action="/connexion" method="post">
    <label for="identifiant">Identifiant</label>
    <input id="identifiant" name="identifiant" data-corpus-ref="identifiant" />
    <label for="mdp">Mot de passe</label>
    <input id="mdp" name="mdp" type="password" data-corpus-ref="mdp" />
    <button>Connexion</button>
  </form>
</main>
</body>
</html>
