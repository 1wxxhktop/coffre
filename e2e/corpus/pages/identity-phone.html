<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profil</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 28rem; }
    form { display: grid; gap: 0.75rem; }
    label { font-weight: 600; }
    input, button { padding: 0.6rem; font: inherit; }
    .muted { color: #555; font-size: 0.9rem; }
  </style>
</head>
<body>
<main>
  <h1>Profil</h1>
  <form action="/profile" method="post">
    <label for="fullName">Nom complet</label>
    <input id="fullName" name="fullName" autocomplete="name" data-corpus-ref="fullName" />
    <label for="phone">Téléphone</label>
    <input id="phone" name="phone" type="tel" autocomplete="tel" data-corpus-ref="phone" />
    <label for="address">Adresse</label>
    <input id="address" name="address" autocomplete="street-address" data-corpus-ref="address" />
    <label for="city">Ville</label>
    <input id="city" name="city" autocomplete="address-level2" data-corpus-ref="city" />
    <button>Mettre à jour</button>
  </form>
</main>
</body>
</html>
