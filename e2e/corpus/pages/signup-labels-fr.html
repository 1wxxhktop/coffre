<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inscription</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 28rem; }
    form { display: grid; gap: 0.75rem; }
    label { font-weight: 600; }
    input, button { padding: 0.6rem; font: inherit; }
    .muted { color: #555; font-size: 0.9rem; }
  </style>
</head>
<body>
<main>
  <h1>Inscription</h1>
  <form action="/inscription" method="post">
    <label for="courriel">Courriel</label>
    <input id="courriel" name="courriel" type="email" autocomplete="username" data-corpus-ref="courriel" />
    <label for="nouveau">Créer un mot de passe</label>
    <input id="nouveau" name="nouveau" type="password" data-corpus-ref="nouveau" />
    <label for="confirmation">Confirmer le mot de passe</label>
    <input id="confirmation" name="confirmation" type="password" data-corpus-ref="confirmation" />
    <button>Valider</button>
  </form>
</main>
</body>
</html>
