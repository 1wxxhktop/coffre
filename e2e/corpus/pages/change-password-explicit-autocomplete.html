<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sécurité du compte</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 28rem; }
    form { display: grid; gap: 0.75rem; }
    label { font-weight: 600; }
    input, button { padding: 0.6rem; font: inherit; }
    .muted { color: #555; font-size: 0.9rem; }
  </style>
</head>
<body>
<main>
  <h1>Sécurité du compte</h1>
  <form action="/account/security" method="post">
    <label for="current">Mot de passe actuel</label>
    <input id="current" name="current" type="password" autocomplete="current-password" data-corpus-ref="current" />
    <label for="new">Nouveau mot de passe</label>
    <input id="new" name="new" type="password" autocomplete="new-password" data-corpus-ref="new" />
    <label for="confirm">Confirmer le nouveau mot de passe</label>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password" data-corpus-ref="confirm" />
    <button>Mettre à jour</button>
  </form>
</main>
</body>
</html>
