<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paiement</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 28rem; }
    form { display: grid; gap: 0.75rem; }
    label { font-weight: 600; }
    input, button { padding: 0.6rem; font: inherit; }
    .muted { color: #555; font-size: 0.9rem; }
  </style>
</head>
<body>
<main>
  <h1>Paiement par carte</h1>
  <form action="/paiement" method="post">
    <label for="titulaire">Titulaire de la carte</label>
    <input id="titulaire" name="titulaire" data-corpus-ref="titulaire" />
    <label for="numero">Numéro de carte</label>
    <input id="numero" name="numero" inputmode="numeric" data-corpus-ref="numero" />
    <label for="expiration">Date d’expiration</label>
    <input id="expiration" name="expiration" placeholder="MM/AA" data-corpus-ref="expiration" />
    <label for="cryptogramme">Code de sécurité</label>
    <input id="cryptogramme" name="cryptogramme" inputmode="numeric" data-corpus-ref="cryptogramme" />
    <button>Payer</button>
  </form>
</main>
</body>
</html>
