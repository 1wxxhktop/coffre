<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Déverrouillage</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 28rem; }
    form { display: grid; gap: 0.75rem; }
    label { font-weight: 600; }
    input, button { padding: 0.6rem; font: inherit; }
    .muted { color: #555; font-size: 0.9rem; }
  </style>
</head>
<body>
<main>
  <h1>Session verrouillée</h1>
  <form action="/unlock" method="post">
    <p class="muted">Confirmez votre mot de passe pour continuer.</p>
    <label for="pass">Mot de passe</label>
    <input id="pass" name="pass" type="password" autocomplete="current-password" data-corpus-ref="pass" />
    <button>Déverrouiller</button>
  </form>
</main>
</body>
</html>
