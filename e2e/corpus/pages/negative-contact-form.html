<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 28rem; }
    form { display: grid; gap: 0.75rem; }
    label { font-weight: 600; }
    input, button { padding: 0.6rem; font: inherit; }
    .muted { color: #555; font-size: 0.9rem; }
  </style>
</head>
<body>
<main>
  <h1>Contact</h1>
  <form action="/contact" method="post">
    <label for="name">Votre nom</label>
    <input id="name" name="name" data-corpus-ref="name" />
    <label for="email">Votre e-mail</label>
    <input id="email" name="email" type="email" data-corpus-ref="email" />
    <label for="message">Message</label>
    <textarea id="message" name="message" rows="5" data-corpus-ref="message"></textarea>
    <button>Envoyer</button>
  </form>
</main>
</body>
</html>
