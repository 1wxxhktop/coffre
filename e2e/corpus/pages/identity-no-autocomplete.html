<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Livraison</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 28rem; }
    form { display: grid; gap: 0.75rem; }
    label { font-weight: 600; }
    input, button { padding: 0.6rem; font: inherit; }
    .muted { color: #555; font-size: 0.9rem; }
  </style>
</head>
<body>
<main>
  <h1>Livraison</h1>
  <form action="/shipping" method="post">
    <label for="firstname">Prénom</label>
    <input id="firstname" name="firstname" data-corpus-ref="firstname" />
    <label for="lastname">Nom</label>
    <input id="lastname" name="lastname" data-corpus-ref="lastname" />
    <label for="email">Adresse e-mail</label>
    <input id="email" name="email" type="email" data-corpus-ref="email" />
    <label for="address">Adresse</label>
    <input id="address" name="address" data-corpus-ref="address" />
    <label for="city">Ville</label>
    <input id="city" name="city" data-corpus-ref="city" />
    <label for="zip">Code postal</label>
    <input id="zip" name="zip" data-corpus-ref="zip" />
    <button>Continuer</button>
  </form>
</main>
</body>
</html>
