<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Newsletter</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 28rem; }
    form { display: grid; gap: 0.75rem; }
    label { font-weight: 600; }
    input, button { padding: 0.6rem; font: inherit; }
    .muted { color: #555; font-size: 0.9rem; }
  </style>
</head>
<body>
<main>
  <h1>Nos nouveautés</h1>
  <p class="muted">Recevez un résumé mensuel.</p>
  <form action="/newsletter" method="post">
    <label for="email">Adresse e-mail</label>
    <input id="email" name="email" type="email" data-corpus-ref="email" />
    <button>S’abonner</button>
  </form>
</main>
</body>
</html>
