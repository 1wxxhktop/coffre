<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paiement</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 28rem; }
    form { display: grid; gap: 0.75rem; }
    label { font-weight: 600; }
    input, button { padding: 0.6rem; font: inherit; }
    .muted { color: #555; font-size: 0.9rem; }
  </style>
</head>
<body>
<main>
  <h1>Paiement</h1>
  <form action="/checkout" method="post">
    <label for="cardholder">Nom sur la carte</label>
    <input id="cardholder" name="cardholder" data-corpus-ref="cardholder" />
    <label for="cardnumber">Numéro de carte</label>
    <input id="cardnumber" name="cardnumber" inputmode="numeric" data-corpus-ref="cardnumber" />
    <label for="expiry">Expiration</label>
    <input id="expiry" name="expiry" placeholder="MM/AA" data-corpus-ref="expiry" />
    <label for="cvv">CVV</label>
    <input id="cvv" name="cvv" inputmode="numeric" data-corpus-ref="cvv" />
    <button>Payer</button>
  </form>
</main>
</body>
</html>
