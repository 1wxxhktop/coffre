<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paramètres de sécurité</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 28rem; }
    form { display: grid; gap: 0.75rem; }
    label { font-weight: 600; }
    input, button { padding: 0.6rem; font: inherit; }
    .muted { color: #555; font-size: 0.9rem; }
  </style>
</head>
<body>
<main>
  <h1>Paramètres de sécurité</h1>
  <section>
    <h2>Mot de passe</h2>
    <form action="/settings/security" method="post">
      <label for="login">Identifiant</label>
      <input id="login" name="login" data-corpus-ref="login" />
      <label for="old">Mot de passe actuel</label>
      <input id="old" name="old" type="password" autocomplete="current-password" data-corpus-ref="old" />
      <label for="new">Nouveau mot de passe</label>
      <input id="new" name="new" type="password" autocomplete="new-password" data-corpus-ref="new" />
      <label for="confirm">Confirmation du nouveau mot de passe</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" data-corpus-ref="confirm" />
      <button>Enregistrer les modifications</button>
    </form>
  </section>
</main>
</body>
</html>
