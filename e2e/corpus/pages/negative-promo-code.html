<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panier</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 28rem; }
    form { display: grid; gap: 0.75rem; }
    label { font-weight: 600; }
    input, button { padding: 0.6rem; font: inherit; }
    .muted { color: #555; font-size: 0.9rem; }
  </style>
</head>
<body>
<main>
  <h1>Votre panier</h1>
  <p class="muted">Un code promotionnel ?</p>
  <form action="/cart/promo" method="post">
    <label for="promo">Code promo</label>
    <input id="promo" name="promo" type="text" data-corpus-ref="promo" />
    <button>Appliquer</button>
  </form>
</main>
</body>
</html>
