<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catalogue</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 28rem; }
    form { display: grid; gap: 0.75rem; }
    label { font-weight: 600; }
    input, button { padding: 0.6rem; font: inherit; }
    .muted { color: #555; font-size: 0.9rem; }
  </style>
</head>
<body>
<main>
  <header>
    <form action="/search" method="get">
      <input type="search" name="q" placeholder="Rechercher dans le catalogue" data-corpus-ref="header-search" />
    </form>
  </header>
  <h1>Catalogue</h1>
  <form action="/filter" method="get">
    <label for="filter">Filtrer</label>
    <input id="filter" name="filter" type="search" data-corpus-ref="filter" />
    <button>Filtrer</button>
  </form>
</main>
</body>
</html>
