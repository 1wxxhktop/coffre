<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aide</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 28rem; }
    form { display: grid; gap: 0.75rem; }
    label { font-weight: 600; }
    input, button { padding: 0.6rem; font: inherit; }
    .muted { color: #555; font-size: 0.9rem; }
  </style>
</head>
<body>
<main>
  <h1>Aide</h1>
  <form action="/help" method="get">
    <label for="query">Votre question</label>
    <input id="query" name="query" type="text" placeholder="Mot de passe oublié" data-corpus-ref="query" />
    <button>Rechercher</button>
  </form>
</main>
</body>
</html>
