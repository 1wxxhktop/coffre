<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Préférences</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 28rem; }
    form { display: grid; gap: 0.75rem; }
    label { font-weight: 600; }
    input, button { padding: 0.6rem; font: inherit; }
    .muted { color: #555; font-size: 0.9rem; }
  </style>
</head>
<body>
<main>
  <h1>Préférences</h1>
  <div aria-hidden="true">
    <input type="password" name="legacy" data-corpus-ref="aria-password" />
  </div>
  <form action="/preferences" method="post">
    <label for="theme">Thème</label>
    <input id="theme" name="theme" data-corpus-ref="theme" />
    <button>Enregistrer</button>
  </form>
</main>
</body>
</html>
