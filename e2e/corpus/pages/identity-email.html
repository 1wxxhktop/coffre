<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Facturation</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 28rem; }
    form { display: grid; gap: 0.75rem; }
    label { font-weight: 600; }
    input, button { padding: 0.6rem; font: inherit; }
    .muted { color: #555; font-size: 0.9rem; }
  </style>
</head>
<body>
<main>
  <h1>Facturation</h1>
  <form action="/billing" method="post">
    <label for="fullName">Nom complet</label>
    <input id="fullName" name="fullName" autocomplete="name" data-corpus-ref="fullName" />
    <label for="email">Adresse e-mail</label>
    <input id="email" name="email" type="email" autocomplete="email" data-corpus-ref="email" />
    <label for="country">Pays</label>
    <input id="country" name="country" autocomplete="country" data-corpus-ref="country" />
    <button>Enregistrer</button>
  </form>
</main>
</body>
</html>
